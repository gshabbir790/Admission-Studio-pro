name: admission_studio_pro
description: "Admission Photo Studio Pro — offline batch student photo capture, face-aware resize, background removal, ZIP/PDF export."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Camera & media
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Image processing
  image: ^4.2.0

  # Storage / persistence
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Permissions
  permission_handler: ^11.3.1

  # Export
  archive: ^3.6.1
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.2

  # Save-to-gallery / save-to-folder (v2 fix)
  gal: ^2.3.3
  file_picker: ^10.3.10

  # Background segmentation
  google_mlkit_selfie_segmentation: ^0.11.0

  # Utilities
  uuid: ^4.5.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# Remove dependency_overrides block completely

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launch_background"
  ios: false   # <--- Is ko false kar dein
  image_path: "assets/icon/app_icon_master_1024.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon_master_1024.png"
